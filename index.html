<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact Mondrian Painting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Top Row -->
    <div class="box red-top"></div>
    <div class="box white-top-center"></div>
    <div class="box white-top-right-top"></div>
    
    <!-- Yellow Block -->
    <div class="box yellow-right"></div>
    
    <!-- Middle Left/Center -->
    <div class="box blue-left"></div>
    <div class="box black-center"></div>
    <div class="box white-right-mid"></div>

    <!-- Bottom Left Section -->
    <div class="box white-thin-line"></div>
    <div class="box white-bottom-left"></div>

    <!-- Bottom Red Blocks -->
    <div class="box red-bottom-left"></div>
    <div class="box red-bottom-right"></div>

    <!-- Very Bottom Blue & White -->
    <div class="box blue-bottom"></div>
    <div class="box white-bottom-right"></div>
  </div>

</body>
</html>
